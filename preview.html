<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>बड़ी देवी जी — पूजा इफेक्ट Preview</title>
<style>
:root{color-scheme:light}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,'Noto Sans Devanagari',sans-serif;background:#fff9ed;color:#4b1118}
.preview-bar{position:sticky;top:0;z-index:20;background:linear-gradient(110deg,#4c0710,#781522);color:#ffdf9a;padding:10px 14px;box-shadow:0 4px 18px #26000840}
.topline{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand{font-weight:800;font-size:16px}.sub{font-size:11px;color:#ffe9c4;opacity:.9}
.pill{font-size:11px;border:1px solid #d7a94d;border-radius:30px;padding:5px 9px;color:#ffe4a3}
.note{font-size:12px;margin:8px 0 9px;color:#ffedce}
.actions{display:flex;gap:7px;overflow-x:auto;padding-bottom:2px}
button{flex:0 0 auto;border:1px solid #d6a44a;border-radius:22px;background:#fff4d9;color:#6d1019;padding:9px 12px;font-weight:700;font-size:13px;cursor:pointer}
button:active{transform:scale(.97)}
.preview-frame{position:relative;height:calc(100dvh - 120px);min-height:520px;background:#650d16;overflow:hidden}
iframe{display:block;border:0;width:100%;height:100%;background:#fff}
.fx-layer{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.petal{position:absolute;top:-35px;font-size:25px;animation:fall 3.4s linear forwards;filter:drop-shadow(0 2px 2px #0003)}
@keyframes fall{to{transform:translate3d(var(--drift),110vh,0) rotate(620deg);opacity:.15}}
.diya{position:absolute;left:50%;top:47%;font-size:62px;transform:translate(-50%,-50%);filter:drop-shadow(0 0 18px #ffad24);animation:orbit 2.6s ease-in-out forwards}
@keyframes orbit{0%{opacity:0;transform:translate(-50%,-50%) scale(.5) rotate(-20deg)}20%,80%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.5) rotate(25deg)}}
.wave{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);font-size:clamp(56px,12vw,100px);animation:wave 2.2s ease-out forwards;filter:drop-shadow(0 5px 10px #7b3c0c66)}
@keyframes wave{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}25%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.6)}}
.bell{position:absolute;right:8%;top:12%;font-size:64px;transform-origin:50% 0;animation:ring 1.8s ease-in-out forwards;filter:drop-shadow(0 4px 8px #0005)}
@keyframes ring{0%,100%{transform:rotate(0)}15%,45%,75%{transform:rotate(18deg)}30%,60%,90%{transform:rotate(-18deg)}}
@media(max-width:600px){.preview-frame{height:calc(100dvh - 144px);min-height:460px}.brand{font-size:14px}.note{font-size:11px}}
</style>
</head>
<body>
<header class="preview-bar">
 <div class="topline"><div><div class="brand">श्री श्री बड़ी देवी जी · तुलसी मंडी</div><div class="sub">पूजा इफेक्ट — Preview</div></div><span class="pill">मैरून थीम</span></div>
 <p class="note">यह केवल देखने के लिए अलग Preview है। मुख्य वेबसाइट और उसका वीडियो बटन नहीं बदले गए हैं।</p>
 <div class="actions">
  <button type="button" onclick="flowers()">🌸 पुष्प वर्षा</button>
  <button type="button" onclick="diya()">🪔 दीप आरती</button>
  <button type="button" onclick="conch()">🐚 शंखनाद</button>
  <button type="button" onclick="bell()">🔔 मंदिर घंटी</button>
 </div>
</header>
<main class="preview-frame">
 <iframe src="/" title="मौजूदा बड़ी देवी जी वेबसाइट"></iframe>
 <div class="fx-layer" id="fx" aria-hidden="true"></div>
</main>
<script>
const fx=document.getElementById('fx');
function flowers(){for(let i=0;i<34;i++){const e=document.createElement('span');e.className='petal';e.textContent=['🌸','🌼','🏵️','🌺'][i%4];e.style.left=Math.random()*100+'%';e.style.animationDelay=(Math.random()*.9)+'s';e.style.setProperty('--drift',(Math.random()*180-90)+'px');fx.appendChild(e);setTimeout(()=>e.remove(),4700)}}
function show(symbol,cls,duration=2600){const e=document.createElement('span');e.className=cls;e.textContent=symbol;fx.appendChild(e);setTimeout(()=>e.remove(),duration)}
function diya(){show('🪔','diya')}
function conch(){show('🐚','wave');tone(392,.7);setTimeout(()=>tone(523,.8),180)}
function bell(){show('🔔','bell');tone(880,.9);setTimeout(()=>tone(660,.7),160);setTimeout(()=>tone(990,.8),330)}
function tone(freq,duration){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const c=new C(),o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(.0001,c.currentTime);g.gain.exponentialRampToValueAtTime(.12,c.currentTime+.03);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+duration);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+duration+.04);o.onended=()=>c.close()}catch(e){}}
</script>
</body>
</html>
