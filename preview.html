function decorate(){try{const d=frame.contentDocument;if(!d||!d.head||!d.body)return;if(!d.getElementById('premiumPreviewTheme')){const s=d.createElement('style');s.id='premiumPreviewTheme';s.textContent=theme;d.head.appendChild(s)}const p=d.getElementById('heroPhoto');if(p&&!d.getElementById('previewLampRow')){const row=d.createElement('div');row.id='previewLampRow';row.className='preview-lamp-row';row.innerHTML=Array.from({length:11},()=>'<span class="lamp">🪔</span>').join('')+'<svg class="preview-hand" viewBox="0 0 170 150" role="img" aria-label="दीप अर्पित करता हुआ हाथ"><defs><linearGradient id="skin" x2="1" y2="1"><stop stop-color="#f6d0a4"/><stop offset=".6" stop-color="#c27e50"/><stop offset="1" stop-color="#85452f"/></linearGradient></defs><path d="M18 146Q30 122 48 106L70 83Q77 75 84 81Q89 86 83 94L69 109Q80 102 96 91L121 73Q130 67 136 74Q141 81 132 88L111 105Q128 95 139 100Q146 106 137 114L113 130Q105 139 101 150Z" fill="url(#skin)" stroke="#65311f" stroke-width="2"/><path d="M42 117Q60 99 74 88M65 123Q83 108 98 99" fill="none" stroke="#f9dfc1" stroke-width="3" stroke-linecap="round"/><path d="M76 75Q85 55 101 75Q111 86 121 83Q112 103 94 104Q78 99 76 75Z" fill="#dfa33e" stroke="#875019" stroke-width="2"/><path d="M96 71Q88 56 100 42Q113 58 104 72Z" fill="#ffb72f"/><path d="M100 67Q96 56 101 49Q107 59 103 68Z" fill="#fff5b4"/></svg>';p.insertAdjacentElement('afterend',row)}}catch(e){}}
frame.addEventListener('load',()=>{decorate();setTimeout(decorate,700);setTimeout(decorate,1800)});
function fx(){try{const d=frame.contentDocument;let l=d.getElementById('previewFx');if(!l){l=d.createElement('div');l.id='previewFx';l.style.cssText='position:fixed;inset:0;z-index:999999;pointer-events:none;overflow:hidden';d.body.appendChild(l)}return l}catch(e){return null}}
function flowers(){const l=fx();if(!l)return;for(let i=0;i<35;i++){const e=l.ownerDocument.createElement('span');e.textContent=['🌸','🌼','🌺','🏵️'][i%4];e.style.cssText='position:absolute;left:'+Math.random()*100+'%;top:-30px;font-size:25px;animation:petalFall 3.6s linear forwards;animation-delay:'+Math.random()+'s';l.appendChild(e);setTimeout(()=>e.remove(),4700)}}
function aarti(){const l=fx();if(!l)return;const e=l.ownerDocument.createElement('span');e.textContent='🪔';e.style.cssText='position:absolute;left:50%;top:48%;font-size:78px;filter:drop-shadow(0 0 22px #ffb52c);animation:aartiGlow 2.5s forwards';l.appendChild(e);setTimeout(()=>e.remove(),2600)}

</script><style>@keyframes petalFall{to{transform:translateY(110vh) rotate(620deg);opacity:.08}}@keyframes aartiGlow{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}20%,80%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.5)}}@keyframes bellSwing{0%,100%{transform:rotate(0)}20%,60%{transform:rotate(18deg)}40%,80%{transform:rotate(-18deg)}}</style></body></html>
